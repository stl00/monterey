[project]
name = "portfolio-aggregator"
version = "0.1.0"
description = "Aggregate holdings across Schwab, OKX, Futu and more"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
futu = ["futu-api>=9.0"]
dev = ["pytest>=8"]

[project.scripts]
portfolio = "portfolio.cli:main"

[tool.setuptools]
packages = ["portfolio", "portfolio.connectors"]
